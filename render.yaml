# SafeTrade - Render Blueprint (Infrastructure as Code)
# https://render.com/docs/blueprint-spec

databases:
  - name: safeticket-db
    databaseName: safeticket
    # Dashboard may show a higher plan (e.g. Basic); if you replace the DB instance, re-link DATABASE_URL on the web service.
    plan: free

services:
  # Django Backend (API)
  - type: web
    name: safeticket-api
    runtime: python
    rootDir: backend
    # Repo root build_render.sh: npm build → pip → python manage.py migrate --noinput → collectstatic.
    buildCommand: bash ../build_render.sh
    # Runs against live DATABASE_URL before traffic switches — helps after Payme/migration deploys if build DB differed.
    preDeployCommand: python manage.py migrate --noinput
    # Runtime: migrate + idempotent seeds (August 2026, Odiya/Osher Menora, Eyal Golan Menora x4) + fix_admin, then Gunicorn (backend/start_render.sh).
    startCommand: bash start_render.sh
    plan: free
    envVars:
      # Must be the *current* Postgres internal URL. Upgrading DB plan or creating a new instance requires updating this link.
      - key: DATABASE_URL
        fromDatabase:
          name: safeticket-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "safeticket-api.onrender.com,localhost,127.0.0.1"
      - key: API_PUBLIC_ORIGIN
        value: https://safeticket-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Set to true only while testing uploads; uses looser PDF MIME + PyPDF + fallbacks (see settings.RELAX_PDF_UPLOAD_VALIDATION).
      - key: RELAX_PDF_UPLOAD_VALIDATION
        value: "false"
      # Media (PDFs, images): paste from Cloudinary dashboard — enables persistent storage vs ephemeral disk.
      - key: CLOUDINARY_URL
        sync: false
      # Baked into Vite build when build_render.sh runs npm run build (must match public API origin).
      - key: VITE_API_URL
        value: https://safeticket-api.onrender.com

  # React Frontend — Node SEO shell (injects Event JSON-LD/meta into initial HTML for /event/*)
  - type: web
    name: safeticket-web
    runtime: node
    rootDir: frontend
    buildCommand: export VITE_BUILD_ID="${VITE_BUILD_ID:-${RENDER_GIT_COMMIT:-unknown}}" && npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://safeticket-api.onrender.com
      - key: API_URL
        value: https://safeticket-api.onrender.com
      - key: NODE_VERSION
        value: "20"

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0045af"/>
      <stop offset="100%" style="stop-color:#001a44"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="600" y="260" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">TradeTix</text>
  <text x="600" y="350" text-anchor="middle" fill="#c7d7ff" font-family="Arial, Helvetica, sans-serif" font-size="32" direction="rtl">זירת מסחר בטוחה לכרטיסים בישראל</text>
  <rect x="420" y="420" width="360" height="8" rx="4" fill="#4ade80"/>
